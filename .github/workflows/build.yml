name: Build MS-DOS Doom

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: msdos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build doom.exe (embedded CWSDPMI)
        run: |
          # Force Docker-based DJGPP cross compiler (matches the Makefile default)
          make DOCKER=1 msdos_embedded
          ls -la doom.exe
          file doom.exe || true

      - name: Create release zip
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            VERSION="git-${GITHUB_SHA::7}"
          fi
          mkdir -p release
          cp doom.exe release/
          # Optional: include a short README for the zip
          cat > release/README.txt << EOF
          Bare Metal Doom - MS-DOS / FreeDOS (DJGPP)

          doom.exe   - Self-contained (CWSDPMI embedded)
          Requires: 386+ with FPU (or EMU387.DXE), ~8 MB RAM
          Sound:     set BLASTER=A220 I5 D1 (or similar)
          WAD:       Place doom.wad / doom1.wad / freedoom*.wad next to the exe

          Built from: ${GITHUB_REPOSITORY}@${GITHUB_SHA}
          EOF
          cd release
          zip -9 "../doom-msdos-${VERSION}.zip" *
          cd ..
          ls -la *.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: doom-msdos
          path: msdos/doom-msdos-*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: msdos/doom-msdos-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
